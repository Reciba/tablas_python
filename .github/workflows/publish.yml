name: Publicar automáticamente en PyPI

on:
  push:
    tags:
      - 'v*' # Se activa automáticamente cuando creas una versión (ej: v0.1.3, v0.2.0)
  workflow_dispatch: # También te permite ejecutarlo manualmente desde GitHub con un botón

jobs:
  build-and-publish:
    name: Compilar y publicar en PyPI
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Descargar código
        uses: actions/checkout@v4

      - name: 🐍 Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 📦 Instalar herramientas de empaquetado
        run: |
          python -m pip install --upgrade pip
          pip install build

      - name: ⚙️ Compilar distribución (wheel y sdist)
        run: python -m build

      - name: 🚀 Publicar en PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
